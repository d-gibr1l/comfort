# Builds the debug app and runs the unit tests on every push and pull request, so a change that
# doesn't compile or breaks a test shows up within minutes, not on the phone.
#
# Only checks: it builds no release APK, signs nothing and publishes nothing — releases are still
# made by hand (the release keystore isn't in the repo, so this couldn't sign one anyway). A failed
# run is a red ✗ on the commit and an email; it blocks nothing unless branch protection asks for it.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The toolchain app/build.gradle.kts asks for (jvmToolchain(17)).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle's downloads and build cache between runs.
      - uses: gradle/actions/setup-gradle@v4

      # The runner's Android SDK has its licences accepted; the Android Gradle plugin fetches the
      # platform (compileSdk 36) and build tools itself if they're missing.
      - name: Build debug and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      # What failed, when a test did.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # yt_dlp_wrapper.py against a local server: a stopped download resumes, a stopped conversion
  # isn't downloaded again (tools/test_wrapper_resume.py). Against the newest yt-dlp on purpose —
  # what users get from Settings › Updates and engines — so an upstream change that breaks resuming
  # fails here instead of quietly on phones.
  wrapper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Resume and conversion tests
        run: python -B tools/test_wrapper_resume.py
