name: Bug report
description: Something in Comfort doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If one site stopped downloading, use **Site not working** instead.
        Please check you're on the [latest Comfort](https://github.com/d-gibr1l/comfort/releases/latest) first.

  - type: input
    id: version
    attributes:
      label: Comfort version
      description: Settings › About.
      placeholder: "1.3.1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Samsung Galaxy S24, Android 16"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots or a screen recording help a lot.
      placeholder: |
        1. Shared a link from …
        2. Tapped …
        3. Expected …, but …
    validations:
      required: true

  - type: dropdown
    id: how-often
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (if it's about a download)
      description: |
        Settings › Advanced › Logs, then **Export logs** and attach the file, or paste the part about this download.
        Passwords, cookies and logins are blanked, but the links you downloaded are in it: remove any you'd rather not share.
      render: text
