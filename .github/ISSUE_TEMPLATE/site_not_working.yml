name: Site not working
description: Links from one site fail to download, or download the wrong thing.
labels: ["site-broken"]
body:
  - type: markdown
    attributes:
      value: |
        Sites change often, and most breakages are fixed by a newer yt-dlp or gallery-dl.
        **Please update the engines first:** Settings › Updates and engines › Check for updates.

  - type: checkboxes
    id: updated
    attributes:
      label: Engines updated
      options:
        - label: I updated the engines in Settings › Updates and engines and it still fails.
          required: true

  - type: input
    id: site
    attributes:
      label: Site
      placeholder: "instagram.com"
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Example link
      description: A public link that fails. Leave it out if the post is private or personal.
      placeholder: "https://…"

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: Shown on the download's card, or in Settings › Updates and engines › Which engine each site uses.
      options:
        - yt-dlp
        - gallery-dl
        - Instaloader
        - Spotify
        - Not sure
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Comfort and engine versions
      description: Settings › About, and Settings › Updates and engines.
      placeholder: "Comfort 1.3.1, yt-dlp 2026.10.26, gallery-dl 1.32.19"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The error Comfort showed, or what was wrong with the download.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Settings › Advanced › Logs, then **Export logs** and attach the file, or paste the part about this download.
        Passwords, cookies and logins are blanked, but the links you downloaded are in it: remove any you'd rather not share.
      render: text
